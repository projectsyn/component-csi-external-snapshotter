apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/part-of: csi-external-snapshotter
  name: syn-csi-snapshot-controller
  namespace: syn-csi-external-snapshotter
spec:
  minReadySeconds: 35
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-controller
    spec:
      containers:
      - args:
        - --v=5
        - --leader-election=true
        image: registry.k8s.io/sig-storage/snapshot-controller:v8.6.0
        imagePullPolicy: IfNotPresent
        name: snapshot-controller
      serviceAccountName: syn-csi-snapshot-controller
